aid: im8
name: IM8 Health
description: >-
  IM8 Health is a health and wellness company whose flagship product, IM8 Daily
  Ultimate Essentials, is a clinically studied, third-party tested all-in-one daily
  supplement combining 90 nutrient-rich ingredients — vitamins, minerals, probiotics,
  prebiotics, adaptogens and superfoods — into a single drink that replaces roughly
  16 capsules. Co-founded by David Beckham and guided by a named scientific advisory
  board, IM8 sells direct-to-consumer through its Shopify-powered online store at
  im8health.com. That storefront exposes a modern agent-native commerce surface: a
  Universal Commerce Protocol (UCP) merchant profile, a hosted Model Context Protocol
  (MCP) shopping endpoint, an llms.txt / agents.md guide for AI shopping assistants,
  and Shopify Customer Account OAuth 2.0 / OpenID Connect authentication (including
  customer-account-mcp-api scopes). IM8 is a General Catalyst portfolio company added
  to the API Evangelist network and enriched from its public agent-commerce surface.
